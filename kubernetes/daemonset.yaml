apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      name: log-agent
  template:
    metadata:
      labels:
        name: log-agent
    spec:
      containers:
      - name: log-agent
        image: busybox:1.35
        command: ["sh", "-c", "tail -F /app/logs/app.log || echo 'Waiting for logs...' && sleep 3600"]
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
          readOnly: true
      volumes:
      - name: logs-volume
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
      tolerations:
      - operator: Exists